name: Build and pre-release Cranberry image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_image:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Generate build tag
      id: buildtag
      run: echo "::set-output name=timestamp::$(date +%s)"

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag buildenv:${{ steps.buildtag.outputs.timestamp }}

    - name: Run make all in the Docker container
      run: |
          docker run --name build_container -v ${{ github.workspace }}:/workspace buildenv:${{ steps.buildtag.outputs.timestamp }} make -C /workspace all

    - name: Copy kernel8.img from Docker container
      run: docker cp build_container:/workspace/kernel8.img kernel8.img

    - name: Upload kernel8.img as an artifact
      uses: actions/upload-artifact@v3
      with:
        name: kernel8-img
        path: kernel8.img

    - name: set env
      run: echo "NOW=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      with:
        tag_name: "${{ env.NOW }}"
        release_name: Release "${{ env.NOW }}"
        draft: false
        prerelease: true

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./kernel8.img
        asset_name: kernel8.img
        asset_content_type: application/octet-stream
